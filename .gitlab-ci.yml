stages:
  - verify
  - test
  - image

default:
  image: node:24-bookworm
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .nuxt/
  before_script:
    - npm ci

lint:
  stage: verify
  script:
    - npm run lint

typecheck:
  stage: verify
  script:
    - npm run typecheck

unit:
  stage: test
  variables:
    DB_PATH: ./data/ci.db
  script:
    - npm run db:reset
    - npm run import:legacy
    - npm test
    - npm run golden

docker:
  stage: image
  image: docker:28
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
  before_script: []
  cache: {}
  script:
    - docker build -f deploy/Dockerfile -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - |
      if [ -n "$CI_REGISTRY_USER" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
